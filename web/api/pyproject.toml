[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-ads-web-api"
version = "0.1.0"
description = "Internal web service for Claude Ads: audits, Meta read-only ingestion, Claude workers, and mutation-plan drafts"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "httpx>=0.27,<1",
    "anthropic>=0.40,<1",
    "argon2-cffi>=23,<26",
    "itsdangerous>=2.2,<3",
    "python-multipart>=0.0.9,<1",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
pdf = ["weasyprint>=69.0,<70.0"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
